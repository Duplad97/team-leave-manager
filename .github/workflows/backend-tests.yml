name: Backend Tests

on:
  push:
    paths:
      - backend/**
      - .github/workflows/backend-tests.yml
  pull_request:
    paths:
      - backend/**
      - .github/workflows/backend-tests.yml

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run backend tests
        run: mvn -B test
