spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/team_leave}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: 8080

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  on-call:
    epoch-week: ${ON_CALL_EPOCH_WEEK:2026-01-05}
